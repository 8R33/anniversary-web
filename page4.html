<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Us forever</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         PAGE 4 — YOU & ME
    =========================================== -->

    <section class="page4">

        <!-- ======================================
             DECORATIVE BACKGROUND
        ======================================= -->

        <div class="page4-glow page4-glow-teal"></div>
        <div class="page4-glow page4-glow-pink"></div>


        <!-- ======================================
             TOP SECTION — YOU & ME
        ======================================= -->

        <div class="people-section">

            <!-- ==============================
                 YOU
            =============================== -->

            <div class="person person-you">

                <h2 class="person-title">
                    You
                    <span>♥</span>
                </h2>

                <div class="person-photos">

                    <div class="photo-frame photo-you-1">
                        <img
                            src="assets/images/Muayad1.jpg"
                            alt="You"
                        >
                    </div>

                    <div class="photo-frame photo-you-2">
                        <img
                            src="assets/images/Muayad2.jpg"
                            alt="You"
                        >
                    </div>

                </div>

            </div>


            <!-- ==============================
                 ME
            =============================== -->

            <div class="person person-me">

                <h2 class="person-title">
                    Me
                    <span>♥</span>
                </h2>

                <div class="person-photos">

                    <div class="photo-frame photo-me-1">
                        <img
                            src="assets/images/Bridget1.jpg"
                            alt="Me"
                        >
                    </div>

                    <div class="photo-frame photo-me-2">
                        <img
                            src="assets/images/Bridget2.jpg"
                            alt="Me"
                        >
                    </div>

                </div>

            </div>

        </div>


        <!-- ======================================
             CENTER FIREWORK
        ======================================= -->

        <div class="firework-section">

            <div class="firework">
                🎆
            </div>

            <p class="firework-text">
                Make Us
            </p>

        </div>


        <!-- ======================================
             COUPLE PHOTOS
        ======================================= -->

        <div class="couple-section">

            <div class="couple-photo couple-photo-1">
                <img
                    src="assets/images/Photo1.jpg"
                    alt="Us together"
                >
            </div>

            <div class="couple-photo couple-photo-2">
                <img
                    src="assets/images/Photo2.jpg"
                    alt="Us together"
                >
            </div>

        </div>


        <!-- ======================================
             BOTTOM MESSAGE
        ======================================= -->

        <div class="page4-bottom">

            <div class="little-hearts">
                ♡♡
            </div>

            <button
                class="page4-next"
                onclick="goToPage5()"
            >
                Next<span>❤️</span>
            </button>

        </div>

    </section>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>

</body>

</html>
