<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title> Question? </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         PAGE 3
    =========================================== -->

    <section class="page3">

        <!-- FROSTED GLASS BACKGROUND -->
        <div class="frosted-background"></div>


        <!-- DECORATIVE GLOW -->
        <div class="glow glow-yellow"></div>
        <div class="glow glow-purple"></div>


        <!-- ======================================
             QUESTION CARD
        ======================================= -->

        <div class="question-card">

            <div class="question-heart">
                ❤️
            </div>

            <h1>To the guy who makes my world better</h1>

            <h2>Will you always love me?</h2>

            <p class="playful-text">
                Be honest...
            </p>


            <!-- ==================================
                 ANSWER BUTTONS
            =================================== -->

            <div class="answer-buttons">

                <button
                    class="yes-button"
                    onclick="goToPage4()"
                >
                    Yes 😍
                </button>


                <button
                    class="no-button"
                    id="noButton"
                >
                    No 😢
                </button>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
